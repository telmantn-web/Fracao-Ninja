// ── MATEMÁTICA ────────────────────────────────────────────────
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function simplify(num,den){
  if(den===0)return{num:0,den:1};
  const g=gcd(Math.abs(num),Math.abs(den));
  let n=num/g,d=den/g;
  if(d<0){n=-n;d=-d;}
  return{num:n,den:d};
}
function calcAns(a,b,op){
  let num,den;
  if(op==="+"){num=a.num*b.den+b.num*a.den;den=a.den*b.den;}
  else if(op==="-"){num=a.num*b.den-b.num*a.den;den=a.den*b.den;}
  else if(op==="×"){num=a.num*b.num;den=a.den*b.den;}
  else{num=a.num*b.den;den=a.den*b.num;}
  return simplify(num,den);
}
function ri(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function genFracs(level,op){
  const maxD=LEVELS[level].maxDenom;
  let a,b,t=0;
  do{
    a={num:ri(1,maxD-1),den:ri(2,maxD)};
    b={num:ri(1,maxD-1),den:ri(2,maxD)};
    t++;
  }while(t<40&&((op==="÷"&&b.num===0)||(op==="-"&&a.num*b.den<=b.num*a.den)));
  return{a,b};
}
function genChoices(correct){
  const ws=[];let att=0;
  while(ws.length<3&&att<60){
    att++;
    let wn=correct.num+ri(-3,3),wd=correct.den+ri(-2,2);
    if(wd<=0)wd=correct.den+1;if(wn<=0)wn=1;
    const s=simplify(wn,wd);
    if((s.num!==correct.num||s.den!==correct.den)&&!ws.some(w=>w.num===s.num&&w.den===s.den))ws.push(s);
  }
  return[...ws,correct].sort(()=>Math.random()-0.5);
}
function genQ(level,op,type){
  const{a,b}=genFracs(level,op);
  const correct=calcAns(a,b,op);
  const choices=genChoices(correct);
  if(type==="problem"){
    const pool=PROBLEMS.filter(p=>p.op===op);
    const tmpl=pool[ri(0,pool.length-1)];
    return{a,b,op,correct,choices,type:"problem",text:tmpl.text(a,b),emoji:tmpl.emoji};
  }
  return{a,b,op,correct,choices,type:"calc"};
}

                      <div style={{color:"#fbbf24",fontSize:14,fontWeight:800}}>{s.finalScore} pts</div>
                      <div style={{color:"#94a3b8",fontSize:10}}>Nota {nota} · {s.correctCount}/{s.TOTAL} ✅</div>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Sessões detalhadas */}
            <p style={{color:"#818cf8",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>📋 Sessões Recentes</p>
            {[...historico].reverse().map((s,i)=>{
              const nota=((s.correctCount/s.TOTAL)*10).toFixed(1);
              const pct=Math.round((s.correctCount/s.TOTAL)*100);
              return(
                <div key={i} style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:13,padding:13,marginBottom:9}}>

                    <span style={{background:"rgba(239,68,68,0.12)",border:"1px solid rgba(239,68,68,0.25)",borderRadius:99,padding:"2px 10px",color:"#ef4444",fontSize:11,fontWeight:700}}>{s.wrongCount} erros</span>
                    <span style={{background:"rgba(129,140,248,0.12)",border:"1px solid rgba(129,140,248,0.25)",borderRadius:99,padding:"2px 10px",color:"#818cf8",fontSize:11,fontWeight:700}}>{pct}%</span>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
                    {s.history.map((h,j)=>(
                      <div key={j} style={{width:26,height:26,borderRadius:6,background:h.result==="correct"?"rgba(34,197,94,0.2)":"rgba(239,68,68,0.2)",border:`1px solid ${h.result==="correct"?"#22c55e":"#ef4444"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>
                        {h.result==="correct"?"✅":"❌"}
                      </div>
                    ))}
                  </div>
                  <button onClick={()=>doPrint({...s,selOps:s.selOps||["+","-","×","÷"],selTypes:s.selTypes||["calc","problem"]})}
                    style={{width:"100%",padding:"8px",borderRadius:9,border:"1px solid rgba(34,197,94,0.3)",background:"rgba(34,197,94,0.08)",color:"#22c55e",fontSize:11,fontWeight:700,cursor:"pointer"}}>
                    🖨️ Imprimir Resultado desta Sessão
                  </button>
                </div>
              );
            })}
          </>
        )}
      </div>
      <Footer/>
    </div>
  );
}

// ── APP PRINCIPAL ─────────────────────────────────────────────
function App(){
  const[screen,setScreen]=useState("menu");
  const[level,setLevel]=useState(0);
  const[selOps,setSelOps]=useState(["+","-","×","÷"]);
  const[selTypes,setSelTypes]=useState(["calc","problem"]);
  const[question,setQuestion]=useState(null);
  const[score,setScore]=useState(0);
  const[livesLeft,setLivesLeft]=useState(3);
  const[round,setRound]=useState(0);
  const[timeLeft,setTimeLeft]=useState(45);
  const[feedback,setFeedback]=useState(null);
  const[answered,setAnswered]=useState(false);
  const[streak,setStreak]=useState(0);
  const[maxStreak,setMaxStreak]=useState(0);
  const[bestScore,setBestScore]=useState(0);
  const TOTAL=10;
  const[studentName,setStudentName]=useState("");
  const[correctCount,setCorrectCount]=useState(0);
  const[wrongCount,setWrongCount]=useState(0);
  const[finalScore,setFinalScore]=useState(0);
  const[showBncc,setShowBncc]=useState(false);
  const[history,setHistory]=useState([]);
  const[sessionDate,setSessionDate]=useState("");

  const pickQ=useCallback(()=>{
    const op=selOps[ri(0,selOps.length-1)];
    const typ=selTypes[ri(0,selTypes.length-1)];
    return genQ(level,op,typ);
  },[level,selOps,selTypes]);

  useEffect(()=>{
    if(screen!=="game"||answered)return;
    if(timeLeft<=0){handleAnswer(null);return;}
    const t=setTimeout(()=>setTimeLeft(v=>v-1),1000);
    return()=>clearTimeout(t);
  },[timeLeft,screen,answered]);

  function startGame(){
    if(!studentName.trim()||selOps.length===0||selTypes.length===0)return;
    setScore(0);setLivesLeft(3);setRound(0);setStreak(0);setMaxStreak(0);
    setCorrectCount(0);setWrongCount(0);setHistory([]);
    const now=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
    setSessionDate(now);
    const q=pickQ();setQuestion(q);setTimeLeft(LEVELS[level].timeLimit);
    setFeedback(null);setAnswered(false);setScreen("game");
  }

  function handleAnswer(choice){
    if(answered)return;
    setAnswered(true);
    const ans=question.correct;
    const ok=choice&&choice.num===ans.num&&choice.den===ans.den;
    let ns=score,nl=livesLeft,nst=streak,nms=maxStreak,nc=correctCount,nw=wrongCount;
    if(ok){nst++;if(nst>nms)nms=nst;const bonus=nst>=3?Math.floor(LEVELS[level].points*0.5):0;ns+=LEVELS[level].points+bonus;nc++;setFeedback("correct");}
    else{nst=0;nl--;nw++;setFeedback("wrong");}
    setStreak(nst);setMaxStreak(nms);setScore(ns);setLivesLeft(nl);setCorrectCount(nc);setWrongCount(nw);
    const newHist=[...history,{...question,result:ok?"correct":"wrong"}];
    setHistory(newHist);
    setTimeout(()=>{
      const nr=round+1;
      if(nr>=TOTAL||nl<=0){
        setBestScore(b=>Math.max(b,ns));
        setFinalScore(ns);
        // Salvar no localStorage
        const sessao={
          studentName,finalScore:ns,correctCount:nc,wrongCount:nw,
          maxStreak:nms,level,levelName:LEVELS[level].name,
          selOps,selTypes,history:newHist,TOTAL,
          date:sessionDate,
        };
        const hist=loadHistorico();
        hist.push(sessao);
        saveHistorico(hist);
        setScreen("result");
      }else{
        setRound(nr);const q=pickQ();setQuestion(q);
        setTimeLeft(LEVELS[level].timeLimit);setFeedback(null);setAnswered(false);
      }
    },1500);
  }

  function toggleOp(op){setSelOps(ops=>ops.includes(op)?(ops.length>1?ops.filter(o=>o!==op):ops):[...ops,op]);}
  function toggleType(t){setSelTypes(ts=>ts.includes(t)?(ts.length>1?ts.filter(x=>x!==t):ts):[...ts,t]);}
  function copyLink(){navigator.clipboard.writeText(window.location.href).then(()=>alert("✅ Link copiado! Compartilhe com seus alunos 😊"));}

  if(screen==="historico") return <TelaHistorico onBack={()=>setScreen("menu")}/>;

  const opInfo=question?OPS.find(o=>o.symbol===question.op):null;
  const timerPct=question?(timeLeft/LEVELS[level].timeLimit)*100:100;
  const timerCol=timerPct>50?"#22c55e":timerPct>25?"#f59e0b":"#ef4444";
  const canStart=studentName.trim()&&selOps.length>0&&selTypes.length>0;
  const BG="linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%)";

          <p style={{color:"#a5b4fc",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,marginBottom:12,textAlign:"center"}}>✝️ Deus é tudo que nos temos</p>

          <div style={{borderTop:"1px solid rgba(255,255,255,0.08)",paddingTop:10,marginBottom:10}}>

          </div>

          </div>

          <div style={{background:"rgba(99,102,241,0.1)",border:"1px solid rgba(99,102,241,0.25)",borderRadius:12,padding:11,marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
              <span style={{background:"#6366f1",color:"#fff",fontWeight:800,fontSize:10,padding:"2px 8px",borderRadius:99}}>{BNCC.codigo}</span>
              <span style={{color:"#818cf8",fontSize:10,fontWeight:600}}>{BNCC.campo} · {BNCC.ano}</span>
            </div>
            <p style={{color:"#94a3b8",fontSize:10,lineHeight:1.5,margin:0}}>{BNCC.habilidade}</p>
          </div>

          <div style={{display:"flex",gap:7,marginBottom:7}}>
            <button onClick={startGame} style={{flex:1,padding:11,borderRadius:11,border:"none",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"#fff",fontSize:12,fontWeight:800,cursor:"pointer"}}>🔄 Jogar Novamente</button>
            <button onClick={()=>setScreen("menu")} style={{flex:1,padding:11,borderRadius:11,border:"2px solid rgba(255,255,255,0.1)",background:"transparent",color:"#94a3b8",fontSize:12,fontWeight:700,cursor:"pointer"}}>🏠 Menu</button>
          </div>
          <div style={{display:"flex",gap:7}}>
            <button onClick={()=>doPrint({studentName,finalScore,correctCount,wrongCount,maxStreak,level,selOps,selTypes,history,TOTAL,date:sessionDate})}
              style={{flex:2,padding:11,borderRadius:11,border:"1px solid rgba(34,197,94,0.35)",background:"rgba(34,197,94,0.12)",color:"#22c55e",fontSize:12,fontWeight:800,cursor:"pointer"}}>
              🖨️ Imprimir Resultado
            </button>
            <button onClick={()=>setScreen("historico")} style={{flex:1,padding:11,borderRadius:11,border:"1px solid rgba(129,140,248,0.35)",background:"rgba(129,140,248,0.1)",color:"#818cf8",fontSize:12,fontWeight:800,cursor:"pointer"}}>
              📊 Histórico
            </button>
          </div>
        </div>
        <Footer/>
      </div>
    );
  }

  // ══ JOGO ══════════════════════════════════════════════════
  return(
    <div style={{...base,paddingTop:10}}>
      <div style={{width:"100%",maxWidth:480,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
        <div style={{display:"flex",gap:2}}>
          {[...Array(3)].map((_,i)=><span key={i} style={{fontSize:18,opacity:i<livesLeft?1:0.2}}>❤️</span>)}
        </div>
        <div style={{textAlign:"center"}}>
          <div style={{color:"#818cf8",fontSize:9,fontWeight:600}}>👤 {studentName}</div>
          <div style={{color:"#fbbf24",fontSize:17,fontWeight:900,lineHeight:1}}>{score} pts</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{color:"#94a3b8",fontSize:11,fontWeight:700}}>{round+1}/{TOTAL}</div>
          <div style={{color:"#475569",fontSize:9}}>rodada</div>
        </div>
      </div>
      <div style={{width:"100%",maxWidth:480,height:5,background:"rgba(255,255,255,0.1)",borderRadius:99,marginBottom:8,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${timerPct}%`,background:timerCol,borderRadius:99,transition:"width 1s linear,background 0.5s"}}/>
      </div>
      {streak>=2&&(
        <div style={{background:"rgba(251,191,36,0.15)",border:"1px solid rgba(251,191,36,0.3)",borderRadius:99,padding:"3px 12px",color:"#fbbf24",fontSize:11,fontWeight:700,marginBottom:7}}>
          🔥 Sequência: {streak}x {streak>=3?`· +${Math.floor(LEVELS[level].points*0.5)} bônus!`:""}
        </div>
      )}
      {question&&(
        <div style={{width:"100%",maxWidth:480,flex:1,display:"flex",flexDirection:"column"}}>
          <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:6}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:4,background:`${opInfo.color}22`,border:`1px solid ${opInfo.color}44`,borderRadius:99,padding:"2px 10px"}}>
              <span style={{fontSize:10}}>{opInfo.emoji}</span>
              <span style={{color:opInfo.color,fontSize:10,fontWeight:700}}>{opInfo.label}</span>
            </div>
            {question.type==="problem"&&(
              <div style={{display:"inline-flex",alignItems:"center",gap:3,background:"rgba(139,92,246,0.15)",border:"1px solid rgba(139,92,246,0.3)",borderRadius:99,padding:"2px 8px"}}>
                <span style={{fontSize:9}}>📖</span>
                <span style={{color:"#a78bfa",fontSize:9,fontWeight:700}}>Problema</span>
              </div>
            )}
            <div style={{marginLeft:"auto",color:timerCol,fontSize:13,fontWeight:800}}>⏱ {timeLeft}s</div>
          </div>
          <div style={{background:"rgba(255,255,255,0.06)",borderRadius:18,padding:"16px 15px",marginBottom:10,textAlign:"center",border:feedback==="correct"?"2px solid #22c55e":feedback==="wrong"?"2px solid #ef4444":"2px solid transparent",transition:"border-color 0.3s",flex:1,display:"flex",flexDirection:"column",justifyContent:"center"}}>
            {question.type==="problem"?(
              <div>
                <div style={{fontSize:32,marginBottom:8}}>{question.emoji}</div>
                <p style={{color:"#e2e8f0",fontSize:13,lineHeight:1.75,margin:"0 0 10px",textAlign:"left"}}>{question.text}</p>
                <p style={{color:"#64748b",fontSize:11}}>Qual é o resultado?</p>
              </div>
            ):(
              <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:9,color:"#fff",flexWrap:"wrap"}}>
                <Frac num={question.a.num} den={question.a.den} big/>
                <span style={{fontSize:26,fontWeight:900,color:opInfo.color}}>{question.op}</span>
                <Frac num={question.b.num} den={question.b.den} big/>
                <span style={{fontSize:22,color:"#64748b"}}>=</span>
                <span style={{fontSize:22,color:"#64748b"}}>?</span>
              </div>
            )}
            {feedback&&(
              <div style={{marginTop:9,fontSize:12,fontWeight:700,color:feedback==="correct"?"#22c55e":"#ef4444",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                {feedback==="correct"?"✅ Correto! Muito bem!":<><span>❌ Resposta:</span><Frac num={question.correct.num} den={question.correct.den} color="#ef4444"/></>}
              </div>
            )}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:5}}>
            {question.choices.map((c,i)=>{
              const isC=c.num===question.correct.num&&c.den===question.correct.den;
              let bg="rgba(255,255,255,0.06)",border="2px solid rgba(255,255,255,0.1)";
              if(answered&&isC){bg="rgba(34,197,94,0.2)";border="2px solid #22c55e";}
              if(answered&&!isC){bg="rgba(239,68,68,0.08)";border="2px solid rgba(239,68,68,0.2)";}
              return(
                <button key={i} onClick={()=>handleAnswer(c)} disabled={answered}
                  style={{padding:"15px 8px",borderRadius:12,border,background:bg,color:answered&&isC?"#22c55e":"#fff",fontSize:15,fontWeight:800,cursor:answered?"default":"pointer",transition:"all 0.2s",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <Frac num={c.num} den={c.den} color={answered&&isC?"#22c55e":undefined}/>
                </button>
              );
            })}
          </div>
        </div>
      )}
      <Footer/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
